<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calendar To-Do-List</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="dashboard-layout">
      <!-- Khối Slidebar bên trái -->
      <aside class="sidebar">
        <div class="sidebar-top">
          <h1 class="brand-title">MY DAILY PLANNER</h1>
          <nav class="nav-manu">
            <a href="#" class="nav-link active">
              <span class="icon">📅</span> Calendar
            </a>
            <a href="#" class="nav-link">
              <span class="icon">☑️</span> To-Do-List
            </a>
          </nav>

          <div class="section-label">PROJECTS</div>
          <div class="project-list">
            <div class="project-item">
              <span class="icon">📁</span> UX Revamp
            </div>
            <div class="project-item"><span class="icon">🚀</span> Launch</div>
          </div>
        </div>

        <div class="sidebar-bottom">
          <div class="settinng-action">
            <span class="icon">⚙️</span> Settings
          </div>
          <div class="user-infor">
            <div class="avatar">A</div>
            <span class="username">Nguyen Duc</span>
          </div>
        </div>
      </aside>

      <main class="main-content">
        <header class="topbar">
          <div class="date-controls">
            <h2 id="current-month-year">Tháng --, ----</h2>
            <div class="nav-btn-group">
              <button id="prev-month-btn" class="btn-nav">&lt;</button>
              <button id="next-month-btn" class="btn-nav">&gt;</button>
            </div>
          </div>

          <div class="topbar-actions">
            <div class="view-controls">
              <button id="today-btn" class="btn-secondary">Hôm nay</button>
              <button class="btn-online-active">Tháng ▾</button>
            </div>
            <button id="quick-add-btn" class="btn-primary">
              + Add Event/Task
            </button>
            <button class="icon-btn circle">🔍</button>
            <button class="icon-btn circle">🔔</button>
            <div class="avatar small">A</div>
          </div>
        </header>

        <!-- -- Tiêu đề thứ trong tuần -- -->
        <div class="calendar-card">
          <div class="weekdays-bar">
            <div>Thứ 2</div>
            <div>Thứ 3</div>
            <div>Thứ 4</div>
            <div>Thứ 5</div>
            <div>Thứ 6</div>
            <div>Thứ 7</div>
            <div>Chủ nhật</div>
          </div>
          <div id="calendar-grid" class="calendar-grid"></div>
        </div>
      </main>
    </div>

    <!-- --Thêm/sửa công việc-- -->
    <div id="task-modal" class="modal-backdrop hidden">
      <div class="modal-card">
        <div class="modal-header">
          <h3 id="modal-title">Thêm công việc</h3>
          <button id="close-modal-btn" class="close-x-btn">✕</button>
        </div>

        <form id="task-form">
          <input type="hidden" id="task-date-input" />

          <div class="form-group">
            <label for="task-text-input">Tên công việc</label>
            <input
              type="text"
              id="task-text-input"
              name="taskTitle"
              placeholder="Ví dụ: Team Sync, Ship groceries..."
              required
              autofocus
            />
          </div>

          <!-- [MỚI] Hàng nhập ngày và giờ cụ thể -->
          <div class="form-row">
            <div class="form-group">
              <label for="task-date-picker">Ngày</label>
              <input
                type="date"
                id="task-date-picker"
                name="taskDate"
                required
              />
            </div>
            <div class="form-group">
              <label for="task-time-input">Thời gian (tùy chọn)</label>
              <input
                type="text"
                id="task-time-input"
                name="taskTime"
                placeholder="8:00 AM, 12:00 PM..."
              />
            </div>
          </div>

          <!-- [MỚI] Menu chọn nhãn phân loại tag pastel -->
          <div class="form-group">
            <label for="task-tag-input">Nhãn phân loại (Tag)</label>
            <select id="task-tag-input" name="taskTag">
              <option value="Work">Work (Xanh lá)</option>
              <option value="Design">Design (Xanh biển)</option>
              <option value="Dev">Dev (Tím)</option>
              <option value="Personal">Personal (Cam)</option>
            </select>
          </div>

          <div class="modal-actions">
            <button type="button" id="cancel-task-btn" class="btn-outline">
              Hủy
            </button>
            <button type="submit" class="btn-primary">Lưu việc</button>
          </div>
        </form>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
