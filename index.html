<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calendar To-Do-List</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="dashboard-layout">
      <!-- Khối Sidebar bên trái -->
      <aside class="sidebar">
        <div class="sidebar-top">
          <h1 class="brand-title">MY DAILY PLANNER</h1>
          <nav class="nav-manu">
            <a href="#" class="nav-link active">
              <span class="icon">📅</span> Calendar
            </a>
            <a href="#" class="nav-link" id="todolist-nav-link">
              <span class="icon">☑️</span> To-Do-List
            </a>
          </nav>

          <div class="projects-section-header">
            <div class="section-label">PROJECTS</div>
            <button
              id="add-project-btn"
              class="icon-add-proj"
              title="Thêm dự án"
            >
              +
            </button>
          </div>
          <div class="project-list" id="project-list"></div>

          <div class="section-label">TAGS FILTER</div>
          <div class="tag-filter-list" id="tag-filter-list">
            <button class="tag-filter-btn active" data-tag="ALL">Tất cả</button>
            <button class="tag-filter-btn tag-Daily" data-tag="Daily">
              Daily
            </button>
            <button class="tag-filter-btn tag-Study" data-tag="Study">
              Study
            </button>
            <button class="tag-filter-btn tag-Work" data-tag="Work">
              Work
            </button>
            <button class="tag-filter-btn tag-Project" data-tag="Project">
              Project
            </button>
            <button class="tag-filter-btn tag-Personal" data-tag="Personal">
              Personal
            </button>
            <button class="tag-filter-btn tag-Other" data-tag="Other">
              Other
            </button>
          </div>
        </div>
      </aside>

      <main class="main-content">
        <div id="calendar-view">
          <header class="topbar">
            <div class="date-controls">
              <h2 id="current-month-year">Tháng --, ----</h2>
              <div class="nav-btn-group">
                <button id="prev-month-btn" class="btn-nav">&lt;</button>
                <button id="next-month-btn" class="btn-nav">&gt;</button>
              </div>
            </div>

            <div class="topbar-actions">
              <!-- Search việc -->
              <div class="search-box">
                <input
                  type="text"
                  id="search-input"
                  placeholder="Tìm việc..."
                />
              </div>

              <button id="quick-add-btn" class="btn-primary">
                + Add Event/Task
              </button>
            </div>
          </header>

          <!-- Tiêu đề thứ trong tuần -->
          <div class="calendar-card">
            <div class="weekdays-bar">
              <div>Thứ 2</div>
              <div>Thứ 3</div>
              <div>Thứ 4</div>
              <div>Thứ 5</div>
              <div>Thứ 6</div>
              <div>Thứ 7</div>
              <div>Chủ nhật</div>
            </div>
            <div id="calendar-grid" class="calendar-grid"></div>
          </div>
        </div>

        <!-- Khối 3 cột cho project(ẩn) -->
        <div id="kanban-view" class="hidden">
          <header class="project-header">
            <h1 id="kanban-project-title">Tên dự án</h1>
          </header>

          <div class="kanban-grid-layout">
            <!-- Cột 1 -->
            <div class="kanban-col" data-status="todo">
              <div class="col-head">
                <div class="col-head-left">
                  <span class="badge badge-todo">Việc cần làm</span>
                  <span class="badge-count" id="count-todo">0</span>
                </div>
                <button
                  id="add-kanban-task-btn"
                  class="icon-add-card"
                  title="Thêm việc"
                >
                  +
                </button>
              </div>
              <div class="col-body" id="cards-todo"></div>
            </div>

            <!-- CỘt 2 -->
            <div class="kanban-col" data-status="doing">
              <div class="col-head">
                <div class="col-head-left">
                  <span class="badge badge-doing">Đang thực hiện</span>
                  <span class="badge-count" id="count-doing">0</span>
                </div>
              </div>
              <div class="col-body" id="cards-doing"></div>
            </div>

            <!-- Cột 3 -->
            <div class="kanban-col" data-status="done">
              <div class="col-head">
                <div class="col-head-left">
                  <span class="badge badge-done">Hoàn thành</span>
                  <span class="badge-count" id="count-done">0</span>
                </div>
              </div>
              <div class="col-body" id="cards-done"></div>
            </div>
          </div>
        </div>

        <!-- Khối công việc trong ngày -->
        <div id="todolist-view" class="hidden">
          <div class="myday-container">
            <header class="myday-header">
              <div>
                <h1 class="myday-title">Ngày của Tôi</h1>
                <p id="myday-date" class="myday-subtitle">
                  Sunday, September 13
                </p>
              </div>
            </header>

            <!-- Ô thêm việc nhanh của ngày hôm nay -->
            <div class="myday-add-box">
              <span class="myday-add-icon">+</span>
              <input
                type="text"
                id="myday-quick-input"
                placeholder="Thêm tác vụ ..."
                autocomplete="off"
              />
            </div>

            <!-- Danh sách công việc hôm nay -->
            <div id="myday-task-list" class="myday-task-list"></div>
          </div>
        </div>
      </main>
    </div>

    <!-- Pop-up xem việc trong ngày -->
    <div id="day-details-modal" class="modal-backdrop hidden">
      <div class="modal-card day-details-card">
        <div class="modal-header">
          <div>
            <h3 id="day-details-title">Danh sách công việc</h3>
            <span id="day-details-subtitle" class="text-muted-sm"
              >Ngày: --/--/----</span
            >
          </div>
          <button id="close-day-details-btn" class="close-x-btn">✕</button>
        </div>
        <!-- Thanh tiến độ công việc trong ngày -->
        <div class="day-progress-container">
          <div class="battery-bar">
            <div id="battery-fill" class="battery-fill"></div>
            <span id="battery-percent" class="battery-percent">0%</span>
          </div>
          <span id="progress-count" class="progress-count">0/0</span>
        </div>

        <!-- Danh sách việc chi tiết của ngày -->
        <div id="day-details-task-list" class="day-details-task-list"></div>

        <div class="modal-actions space-between">
          <button type="button" id="day-details-add-btn" class="btn-primary">
            + Thêm việc ngày này
          </button>
          <button type="button" id="day-details-close-btn" class="btn-outline">
            Đóng
          </button>
        </div>
      </div>
    </div>

    <!-- POP-UP THÊM/SỬA CÔNG VIỆC -->
    <div id="task-modal" class="modal-backdrop hidden">
      <div class="modal-card">
        <div class="modal-header">
          <h3 id="modal-title">Thêm công việc</h3>
          <button id="close-modal-btn" class="close-x-btn">✕</button>
        </div>

        <form id="task-form">
          <input type="hidden" id="task-date-input" />

          <div class="form-group">
            <label for="task-text-input">Tên công việc</label>
            <input
              type="text"
              id="task-text-input"
              name="taskTitle"
              placeholder="Ví dụ: Học, chơi, Game"
              required
              autofocus
            />
          </div>

          <!-- Hàng nhập ngày và giờ cụ thể -->
          <div class="form-row">
            <div class="form-group">
              <label for="task-date-picker">Ngày</label>
              <input
                type="date"
                id="task-date-picker"
                name="taskDate"
                required
              />
            </div>
            <div class="form-group">
              <label for="task-time-input">Thời gian</label>
              <input type="time" id="task-time-input" name="taskTime" />
            </div>
          </div>

          <!-- Nhãn Tag công việc -->
          <div class="form-group">
            <label for="task-tag-input">Nhãn (Tag)</label>
            <select id="task-tag-input" name="taskTag">
              <option value="Daily">Daily (Xanh lá)</option>
              <option value="Study">Study (Xanh biển)</option>
              <option value="Work">Work (Tím)</option>
              <option value="Project">Project (Cam)</option>
              <option value="Personal">Personal (Đỏ)</option>
              <option value="Other">Other (Hồng)</option>
            </select>
          </div>

          <div class="modal-actions">
            <button type="button" id="cancel-task-btn" class="btn-outline">
              Hủy
            </button>
            <button type="submit" id="save-task-btn" class="btn-primary">
              Lưu việc
            </button>
          </div>
        </form>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
