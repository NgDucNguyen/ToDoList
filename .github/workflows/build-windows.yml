name: Build Windows
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:electron
      - run: npm run build-exe
      - uses: actions/upload-artifact@v7
        with:
          name: MyDailyPlanner-windows-x64
          path: dist/build-*/MyDailyPlanner-win32-x64/
          if-no-files-found: error
          retention-days: 14
